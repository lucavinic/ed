<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>❤</title>
</head>
<body style="background:#fdf6f8">
<script>
  // carrega o config.js sem cache e redireciona conforme o MODO
  var s = document.createElement('script');
  s.src = 'config.js?t=' + Date.now();
  s.onload = s.onerror = function () {
    var destino = (typeof MODO !== 'undefined' && MODO === 'declaracao') ? 'declaracao.html' : 'cha.html';
    location.replace(destino);
  };
  document.head.appendChild(s);
</script>
</body>
</html>
