<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chá Revelação 🍼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#6fa8dc;--blue-d:#3d7cc0;--pink:#f29bb8;--pink-d:#d9608a;--ink:#3b3350}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);min-height:100svh;overflow-x:hidden;
       background:linear-gradient(135deg,#dcecfb 0%,#fbe3ec 100%);display:flex;align-items:center;justify-content:center}
  .screen{width:100%;max-width:460px;padding:32px 22px;text-align:center;display:none}
  .screen.on{display:block;animation:in .6s ease}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* tela 1 */
  .emoji{font-size:4.2rem;animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-10px)}}
  h1{font-size:2.1rem;margin:14px 0 6px;line-height:1.15}
  h1 .b{color:var(--blue-d)} h1 .g{color:var(--pink-d)}
  .sub{opacity:.75;font-size:1.05rem}
  .btn{margin-top:30px;border:0;cursor:pointer;font:600 1.25rem 'Fredoka',sans-serif;color:#fff;
       padding:18px 40px;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--pink));
       box-shadow:0 12px 28px -10px rgba(120,80,140,.55);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .btn:active{transform:scale(.95)}

  /* roleta */
  .wheel-wrap{position:relative;width:min(340px,86vw);aspect-ratio:1;margin:18px auto 0}
  .pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;
           border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--ink);
           filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
  #wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 10px #fff,0 18px 40px -12px rgba(60,40,90,.45);
         transition:transform 6s cubic-bezier(.12,.75,.12,1)}
  .hub{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:#fff;z-index:2;
       display:grid;place-items:center;font-size:1.8rem;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .status{margin-top:26px;font-size:1.15rem;opacity:.8;min-height:1.5em}

  /* resultado */
  .big{font-size:5rem;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .congrats{font-family:'Dancing Script',cursive;font-size:2.6rem;margin-top:8px}
  .think{font-size:1.25rem;margin-top:12px;opacity:.85}
  .answer{font-size:3rem;font-weight:700;margin-top:4px;animation:pop .8s .3s cubic-bezier(.2,1.6,.4,1) both}
  body.boy .answer,body.boy .congrats{color:var(--blue-d)}
  body.girl .answer,body.girl .congrats{color:var(--pink-d)}
  body.boy{background:linear-gradient(135deg,#cfe4fb,#eaf3fd)}
  body.girl{background:linear-gradient(135deg,#fbd5e3,#fdeef4)}
  .again{margin-top:30px;background:none;border:2px solid currentColor;color:var(--ink);opacity:.6;
         font:500 .95rem 'Fredoka',sans-serif;padding:10px 22px;border-radius:999px;cursor:pointer}

  .conf{position:fixed;top:-20px;width:10px;height:14px;z-index:10;pointer-events:none;animation:drop linear forwards}
  @keyframes drop{to{transform:translateY(110vh) rotate(var(--r))}}
</style>
</head>
<body>

<!-- tela 1 -->
<div class="screen on" id="s1">
  <div class="emoji">🍼</div>
  <h1>Será que é <span class="b">menino</span><br>ou <span class="g">menina</span>?</h1>
  <p class="sub">Tenho um palpite pra você…</p>
  <button class="btn" id="start">Clique aqui ✨</button>
</div>

<!-- tela 2: roleta -->
<div class="screen" id="s2">
  <h1>Girando…</h1>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <svg id="wheel" viewBox="-100 -100 200 200"></svg>
    <div class="hub">🍼</div>
  </div>
  <p class="status" id="status">Segura o coração… 💓</p>
</div>

<!-- tela 3: resultado -->
<div class="screen" id="s3">
  <div class="big" id="bigEmoji"></div>
  <div class="congrats" id="congrats"></div>
  <p class="think">Eu acho que é…</p>
  <div class="answer" id="answer"></div>
  <button class="again" id="again">girar de novo</button>
</div>

<script src="config.js"></script>
<script>
  var nome = (typeof NOME !== 'undefined' && NOME) ? NOME : 'Nayara';
  var forced = (typeof RESULTADO !== 'undefined') ? RESULTADO : 'aleatorio';

  // monta a roleta: 8 fatias alternando menino/menina
  var N = 8, wheel = document.getElementById('wheel'), svg = '';
  for (var i = 0; i < N; i++) {
    var a0 = (i * 360 / N - 90) * Math.PI / 180, a1 = ((i + 1) * 360 / N - 90) * Math.PI / 180;
    var x0 = 100 * Math.cos(a0), y0 = 100 * Math.sin(a0), x1 = 100 * Math.cos(a1), y1 = 100 * Math.sin(a1);
    var boy = i % 2 === 0;
    svg += '<path d="M0 0 L' + x0 + ' ' + y0 + ' A100 100 0 0 1 ' + x1 + ' ' + y1 + ' Z" fill="' + (boy ? '#8fbbe6' : '#f5afc6') + '" stroke="#fff" stroke-width="1.5"/>';
    var mid = (i + .5) * 360 / N;
    svg += '<g transform="rotate(' + mid + ')"><text x="0" y="-70" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="10" letter-spacing=".5" fill="#fff">' + (boy ? 'MENINO' : 'MENINA') + '</text><text x="0" y="-46" text-anchor="middle" font-size="16">' + (boy ? '💙' : '💗') + '</text></g>';
  }
  wheel.innerHTML = svg;

  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); });
    document.getElementById(id).classList.add('on');
  }

  var rotation = 0;
  function spin() {
    document.body.className = '';
    show('s2');
    var isBoy = forced === 'menino' ? true : forced === 'menina' ? false : Math.random() < .5;
    // escolhe uma fatia do resultado e para no meio dela (com leve variação)
    var choices = [];
    for (var i = 0; i < N; i++) if ((i % 2 === 0) === isBoy) choices.push(i);
    var slice = choices[Math.floor(Math.random() * choices.length)];
    var sliceCenter = (slice + .5) * 360 / N;
    var jitter = (Math.random() - .5) * (360 / N) * .6;
    var target = 360 - sliceCenter + jitter;
    var current = ((rotation % 360) + 360) % 360;
    rotation += 360 * 7 + ((target - current + 360) % 360);
    setTimeout(function () { wheel.style.transform = 'rotate(' + rotation + 'deg)'; }, 60);

    var st = document.getElementById('status');
    var msgs = ['Segura o coração… 💓', 'Quase lá…', 'Vai parar…'];
    msgs.forEach(function (m, k) { setTimeout(function () { st.textContent = m; }, k * 2000); });

    setTimeout(function () { reveal(isBoy); }, 6600);
  }

  function reveal(isBoy) {
    document.body.className = isBoy ? 'boy' : 'girl';
    document.getElementById('bigEmoji').textContent = isBoy ? '👶🏻💙' : '👶🏻💗';
    document.getElementById('congrats').textContent = 'Parabéns, ' + nome + '!';
    document.getElementById('answer').textContent = isBoy ? 'um menino! 💙' : 'uma menina! 💗';
    show('s3');
    confetti(isBoy);
  }

  function confetti(isBoy) {
    var cols = isBoy ? ['#3d7cc0', '#6fa8dc', '#a9cdf0', '#ffffff', '#ffd66b'] : ['#d9608a', '#f29bb8', '#fbd0de', '#ffffff', '#ffd66b'];
    for (var i = 0; i < 120; i++) {
      var c = document.createElement('div'); c.className = 'conf';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = cols[Math.floor(Math.random() * cols.length)];
      c.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      var d = 2.5 + Math.random() * 2.5;
      c.style.animationDuration = d + 's'; c.style.animationDelay = Math.random() * 1.5 + 's';
      if (Math.random() < .3) c.style.borderRadius = '50%';
      document.body.appendChild(c);
      (function (el, t) { setTimeout(function () { el.remove(); }, t); })(c, (d + 1.6) * 1000);
    }
  }

  document.getElementById('start').addEventListener('click', spin);
  document.getElementById('again').addEventListener('click', spin);
</script>
</body>
</html>
